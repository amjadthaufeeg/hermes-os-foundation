decision_id: DEC-HOS-010
title: Single-writer file ownership is mandatory
status: approved
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: One writer per file at any given time. No two agents may simultaneously edit the same file. File ownership must
  be explicitly assigned and tracked. Ownership transfers require explicit handoff and baseline commit recording.
reason: Concurrent file writes cause merge conflicts, lost changes, and accountability gaps. Single-writer enforcement is
  the simplest and most reliable concurrency control.
