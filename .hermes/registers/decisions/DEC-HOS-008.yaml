decision_id: DEC-HOS-008
title: Formal Design Studio
status: locked
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: A dedicated Design Studio owns UX structure, visual direction, interaction behavior, accessibility, and design-system
  compliance. Engineering must not independently redefine approved design direction. Design must not independently modify
  business logic, APIs, databases, permissions, or commercial calculations.
reason: Visual quality and UX coherence require dedicated ownership. Separating design authority from engineering prevents
  design decisions from being treated as implementation afterthoughts.
