decision_id: DEC-HOS-017
title: The system is named Hermes Product OS
status: locked
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: 'Hermes Product OS is the primary name of the operating system. Engineering, Design, Research, Quality, Knowledge
  and Operations are divisions within the product operating model. The Command Center is the operational interface. Engineering
  Mission Control is a module inside Command Center.

  '
reason: 'The system has evolved from a pure engineering operating model into a multi-disciplinary product development system
  with Design, Research, Quality, Knowledge, and Operations divisions. "Product OS" accurately reflects this broader scope.
  "Engineering" remains one division within it.

  '
alternatives_considered:
- option: Keep Hermes Engineering OS
  rejected_because: Too narrow — implies only engineering functions, when the system now governs design, research, commercial
    safety, and operations
