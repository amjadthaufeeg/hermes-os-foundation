decision_id: DEC-HOS-014
title: Material UI work requires a UI contract
status: locked
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: Every visual task must have an approved UI contract in addition to the technical task contract. The UI contract
  defines design owner, user goal, information hierarchy, required states, breakpoints, approved tokens, visual acceptance
  criteria, and required visual evidence.
reason: Visual work without explicit contracts leads to inconsistent design and scope drift. The UI contract ensures design
  intent is documented and verifiable before implementation begins.
