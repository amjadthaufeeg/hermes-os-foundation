decision_id: DEC-HOS-015
title: Minimum CI is part of the first foundation release
status: locked
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: Build, type check, lint, existing tests, schema validation, changed-file reporting, scope checking, and protected-zone
  checking are CI gates in the HOS-1 foundation release. CI is not deferred to a later release.
reason: Automated enforcement is prerequisite to evidence-based completion. Without CI gates, governance is procedural only
  — vulnerable to human error and agent non-compliance.
