decision_id: DEC-HOS-013
title: Engineering Mission Control is inside Command Center
status: approved
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: Engineering Mission Control is a module within the broader Command Center dashboard. It is not a standalone system.
  The Command Center includes Executive Overview, Portfolio, Product, Design Studio, Quality, Knowledge, and Operations modules.
reason: Positioning Mission Control as a module rather than a standalone system reflects that engineering is one of several
  disciplines governed by Hermes Product OS.
