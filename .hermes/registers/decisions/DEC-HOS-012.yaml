decision_id: DEC-HOS-012
title: R4 parallel production-code editing is prohibited
status: approved
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: Critical commercial logic — pricing, offers, occupancy, taxes, commissions, markups, cancellation, reconciliation,
  and financial audit logic — is always serialized. No parallel production-code editing is permitted at R4 risk level.
reason: R4 logic has the highest consequence of error. Serialization ensures every R4 change is reviewed without the coordination
  complexity and collision risk of parallel work.
