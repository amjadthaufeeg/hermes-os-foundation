decision: 'Hermes Product OS operates through six divisions: Engineering, Design Studio, Quality, Research, Knowledge, and
  Operations — each with defined responsibilities, boundaries, and reporting relationships to Hermes. Amjad retains final
  product, commercial, and design authority.'
reason: Department-based organization clarifies responsibilities, prevents role confusion, and enables parallel specialization
  without authority conflicts.
