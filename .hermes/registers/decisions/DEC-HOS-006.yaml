decision_id: DEC-HOS-006
title: Evidence determines readiness
status: approved
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: 'No agent assertion alone may establish task completion. Readiness for Amjad approval requires structured, verifiable
  evidence across all required gates: contracts, tests, scope checks, review findings, business fixtures, visual evidence,
  and rollback information.'
reason: Agent self-reporting is unreliable. Structured evidence creates an auditable trail that survives context loss and
  enables independent verification.
