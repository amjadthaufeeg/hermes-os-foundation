decision_id: DEC-HOS-009
title: Parallel Controller subordinate to Hermes
status: approved
date: '2026-07-31'
owner: amjad
applies_to: all
category: governance
decision: The Parallel Execution Controller may coordinate sub-agents, allocate worktrees, and track agent runs. It may not
  change objectives, approve contracts, unlock protected zones, accept or reject review findings, merge code, deploy, or declare
  readiness.
reason: Parallel coordination is a technical function, not an authority function. Keeping the controller subordinate to Hermes
  prevents parallel execution from becoming autonomous or bypassing governance.
