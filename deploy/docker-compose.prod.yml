# /docker/hermes-product-os-prod/docker-compose.yml
# Production Hermes — Phase B read-only foundation
# P4: Production API startup. UID 10010 (same as DB owner).

name: hermes-product-os-prod

services:
  hpos:
    container_name: hermes-product-os-prod
    image: hermes-product-os-hpos:prod-p4-release
    user: "10010:10010"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - HERMES_ENVIRONMENT=PRODUCTION
      - MUTATIONS_DISABLED=true
      - DATABASE_PATH=/opt/hermes/data/production.db
      - SIMULATION_MODE=false
      - PYTHONUNBUFFERED=1
    volumes:
      - hpos-prod-data:/opt/hermes/data:rw
      - hpos-prod-logs:/opt/hermes/logs:rw
    networks:
      - prod-net
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hpos-prod-data:
    name: hermes-product-os-prod_hpos-prod-data
  hpos-prod-logs:
    name: hermes-product-os-prod_hpos-prod-logs

networks:
  prod-net:
    name: hermes-product-os-prod_prod-net
    internal: true