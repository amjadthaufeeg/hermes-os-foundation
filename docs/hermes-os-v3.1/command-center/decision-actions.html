<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HOS-4C — Decision Actions (Simulation)</title>
<style>
:root{--bg:#0a0e14;--surface:#11161d;--border:#1a2030;--text:#cfd4db;--muted:#5c6470;--gold:#c9a03b;--cyan:#26c6da;--green:#34c97a;--red:#e0556a;--amber:#d4a843;--font:'Inter',system-ui,-apple-system,sans-serif;--radius:6px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app{max-width:800px;margin:0 auto;padding:2rem}
.banner{background:var(--amber);color:var(--bg);padding:.5rem 1rem;border-radius:var(--radius);font-size:.7rem;font-weight:600;text-align:center;margin-bottom:1.5rem}
h1{font-size:1.1rem;color:var(--gold);margin-bottom:1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:.75rem}
.card h2{font-size:.85rem;color:var(--gold);margin-bottom:.5rem}
.row{display:flex;justify-content:space-between;padding:.3rem 0;font-size:.75rem;border-bottom:1px solid rgba(26,32,48,.5)}
.row .label{color:var(--muted)}.badge{font-size:.6rem;padding:.1rem .4rem;border-radius:10px;font-weight:600}
.badge.gold{background:rgba(201,160,59,.12);color:var(--gold)}.badge.green{background:rgba(52,201,122,.12);color:var(--green)}.badge.cyan{background:rgba(38,198,218,.1);color:var(--cyan)}.badge.red{background:rgba(224,85,106,.1);color:var(--red)}.badge.amber{background:rgba(212,168,67,.12);color:var(--amber)}
.actions{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap}
.btn{padding:.4rem .8rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.72rem;font-family:var(--font)}
.btn:hover{opacity:.9}.btn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}.btn.red{background:var(--red);color:var(--bg);border-color:var(--red)}.btn:focus-visible{outline:2px solid var(--cyan)}
.panel{background:var(--surface);border:1px solid var(--gold);border-radius:var(--radius);padding:1.5rem;margin-top:1rem}
.panel textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:.5rem;font-family:var(--font);font-size:.75rem;min-height:60px;margin:.5rem 0}
.panel textarea:focus{outline:2px solid var(--cyan)}
.panel input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:.4rem;font-family:var(--font);font-size:.75rem;margin:.25rem 0}
.result{background:var(--surface);border:1px solid var(--green);border-radius:var(--radius);padding:1rem;margin-top:.5rem;font-size:.75rem}
.result.error{border-color:var(--red)}.result .audit{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:.5rem}
.mono{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted)}
@media(max-width:767px){.app{padding:1rem}.actions{flex-direction:column}}
</style>
</head>
<body><div class="app">
<div class="banner">⚠ SIMULATION MODE — NO AUTHORITATIVE DECISION WILL BE CHANGED</div>
<h1>Decision Actions (Simulation)</h1>
<div id="decisions"></div>
<div id="panel"></div>
<div id="result"></div>
<div class="mono" style="margin-top:1.5rem">API: localhost:8420 · Audit: SQLite · HOS-4C</div>
</div>
<script>
var API="http://localhost:8420";
var DATA=[{"id":"DEC-HOS-001","title":"Hermes remains the sole orchestrator","state":"AWAITING_AMJAD","version":1,"owner":"amjad","decision_text":"Kimi, Codex and Claude may build or review within assigned roles, but they may not independently control scope, task-state transitions, agent routing, approval, merge or deployment.","reason":"Prevent conflicting agent authority."},{"id":"DEC-HOS-019","title":"Product-development philosophy governs future expansion","state":"LOCKED","version":1,"owner":"amjad","decision_text":"Future roles and automation must be evaluated against the approved Philosophy.","reason":"Immutable values."}];
function statusBadge(s){var m={AWAITING_AMJAD:'gold',LOCKED:'gold',APPROVED:'green',REJECTED:'red',HOLD:'amber',BLOCKED:'red',CLOSED:'green',IN_REVIEW:'cyan'};return'<span class="badge '+(m[s]||'')+'">'+s+'</span>'}
function renderDecisions(){
  var h='';
  DATA.forEach(function(d,i){h+='<div class="card"><h2>'+d.title+'</h2><div class="row"><span class="label">State</span><span>'+statusBadge(d.state)+'</span></div><div class="row"><span class="label">Version</span><span>'+d.version+'</span></div><div style="font-size:.7rem;color:var(--muted);margin-top:.5rem">'+d.decision_text.substring(0,150)+'…</div><div class="actions">'+getActions(d,i)+'</div></div>'});
  document.getElementById('decisions').innerHTML=h;
}
function getActions(d,i){
  var acts=[];
  if(d.state==='AWAITING_AMJAD'||d.state==='IN_REVIEW')acts.push({label:'APPROVE',cls:'gold',a:'APPROVE'},{label:'REJECT',cls:'red',a:'REJECT'},{label:'DEFER',cls:'amber',a:'DEFER'},{label:'HOLD',cls:'amber',a:'PLACE_ON_HOLD'});
  if(d.state==='HOLD'||d.state==='DEFERRED')acts.push({label:'RESUME',cls:'gold',a:'RESUME'});
  return acts.map(function(a){return'<button class="btn '+a.cls+'" onclick="doAction('+i+',\''+a.a+'\')">'+a.label+'</button>'}).join('');
}
function doAction(i,action){
  var d=DATA[i];
  document.getElementById('panel').innerHTML='<div class="panel"><h2>'+action+' — '+d.title+'</h2><p style="font-size:.75rem;color:var(--muted)">Current: '+d.state+' → Will transition to new state</p><label style="font-size:.7rem;color:var(--muted)">Rationale (required, '+(action==='APPROVE'||action==='REJECT'?'50':'20')+'+ chars)</label><textarea id="rationale" placeholder="Why this action…"></textarea><div id="typed-confirm" style="display:'+(action==='APPROVE'||action==='REJECT'?'block':'none')+'"><label style="font-size:.7rem;color:var(--muted)">Type "'+action+' '+d.id+'" to confirm</label><input type="text" id="typedval" placeholder="'+action+' '+d.id+'"></div><div style="display:flex;gap:.5rem;margin-top:.75rem"><button class="btn gold" onclick="confirmAction('+i+',\''+action+'\')">'+action+'</button><button class="btn" onclick="cancelPanel()">Cancel</button></div></div>';
}
function cancelPanel(){document.getElementById('panel').innerHTML='';document.getElementById('result').innerHTML=''}
function confirmAction(i,action){
  var d=DATA[i];
  var r=document.getElementById('rationale').value;
  var tc=document.getElementById('typedval')?document.getElementById('typedval').value:'';
  var minLen=action==='APPROVE'||action==='REJECT'?50:20;
  if(r.length<minLen){alert('Rationale must be at least '+minLen+' characters');return}
  if(action==='APPROVE'||action==='REJECT'){if(tc!==action+' '+d.id){alert('Type "'+action+' '+d.id+'" to confirm');return}}
  var valid={'AWAITING_AMJAD':{APPROVE:'APPROVED',REJECT:'REJECTED',DEFER:'DEFERRED',PLACE_ON_HOLD:'HOLD'},'HOLD':{RESUME:'AWAITING_AMJAD'},'DEFERRED':{RESUME:'AWAITING_AMJAD'}};
  var target=valid[d.state]&&valid[d.state][action]?valid[d.state][action]:null;
  if(!target){alert('Invalid transition');return}
  var old=d.state;
  d.state=target;d.version++;
  document.getElementById('result').innerHTML='<div class="result" id="res-div"><strong>✓ Simulated '+action+'</strong><br>'+d.id+': '+old+' → '+target+' (v'+d.version+')<br><span class="mono">Audit event recorded · No authoritative change</span></div>';
  document.getElementById('panel').innerHTML='';
  renderDecisions();
}
renderDecisions();
</script>
</body>
</html>
