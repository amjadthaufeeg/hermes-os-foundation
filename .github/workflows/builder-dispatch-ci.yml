name: Builder Dispatch Adapter CI

on:
  push:
    branches: ["feature/builder-dispatch-adapter"]
  pull_request:
    paths:
      - "deploy/builder_dispatch/**"
      - "deploy/hos_auto_02/transport_safe.py"
      - "deploy/hos_auto_02/watcher_entry.py"
      - ".github/workflows/builder-dispatch-ci.yml"

jobs:
  test-builder-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pytest==8.3.5"
      - name: Compile transport boundary
        run: python -m py_compile deploy/hos_auto_02/transport_safe.py deploy/hos_auto_02/watcher_entry.py
      - name: Validate deployment shell
        run: bash -n deploy/builder_dispatch/deploy-builder-dispatch.sh
      - name: Run adapter tests
        run: python -m pytest deploy/builder_dispatch/tests -q
      - name: Run HOS-AUTO-02 regression tests
        run: python -m pytest deploy/hos_auto_02/tests -q
